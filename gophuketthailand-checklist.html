<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Kairali Trails · Phuket Packing Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/nyght-serif" rel="stylesheet">
<style>
  :root{
    --teal:#0496a5; --teal-d:#037885; --green:#24fbaa; --blue:#1e98f7; --orange:#f3792a;
    --dark:#052a30; --dark-2:#0a3a42; --off:#f4fcfd; --muted:#5a9aa5;
    --ink:#0e2e34; --line:#d7eef1; --card:#ffffff;
    --r-s:8px; --r-m:16px; --r-l:24px;
    --sh:0 4px 24px rgba(4,150,165,.12); --sh-h:0 14px 40px rgba(4,150,165,.22);
    --f-display:'Tanker','Poppins',system-ui,sans-serif;
    --f-serif:'Nyght Serif',Georgia,serif;
    --f-body:'Poppins',system-ui,sans-serif;
    --f-label:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--f-body);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
       background:
         radial-gradient(circle at 1px 1px, rgba(4,150,165,.055) 1px, transparent 1.7px) 0 0/24px 24px,
         linear-gradient(180deg,#e7fafc 0,var(--off) 260px,var(--off) 100%);
       background-attachment:fixed}
  img{max-width:100%}
  .wrap{max-width:780px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) calc(70px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}

  .topbar{display:flex;align-items:center;justify-content:flex-start;padding:18px 0 6px}
  .topbar img.logo{height:34px;display:block}

  .hero{position:relative;border-radius:var(--r-l);overflow:hidden;margin-top:6px;box-shadow:var(--sh-h);background:linear-gradient(135deg,var(--dark),var(--teal-d) 60%,var(--teal));color:#eafcfb;padding:28px 26px}
  .hero::before{content:"";position:absolute;inset:0;opacity:.10;background-image:linear-gradient(135deg,transparent 46%,#fff 47% 48%,transparent 49%),linear-gradient(45deg,transparent 46%,#fff 47% 48%,transparent 49%);background-size:36px 36px}
  .hero .eb{position:relative;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
  .hero h1{position:relative;font-family:var(--f-display);font-size:34px;margin:0;letter-spacing:.01em;color:#fff}
  .hero p{position:relative;font-family:var(--f-serif);font-style:italic;color:rgba(234,252,251,.82);font-size:15.5px;margin:4px 0 0}

  /* progress */
  .prog{position:sticky;top:0;z-index:10;background:rgba(244,252,253,.9);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:12px 0 12px;margin-top:8px}
  .prog .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .prog .txt{font-family:var(--f-label);font-size:11.5px;color:var(--muted);letter-spacing:.04em}
  .prog .reset{font-family:var(--f-body);font-size:12px;color:var(--teal-d);background:none;border:none;cursor:pointer;font-weight:600}
  .prog .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .prog .fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--green));width:0%;transition:width .3s}
  .dl-btn{display:inline-flex;align-items:center;gap:8px;margin-top:11px;width:100%;justify-content:center;font-family:var(--f-body);font-weight:600;font-size:13.5px;color:#fff;background:linear-gradient(135deg,var(--teal-d),var(--teal));border:none;border-radius:12px;padding:12px 16px;cursor:pointer;box-shadow:0 6px 16px rgba(4,150,165,.28);transition:transform .14s,box-shadow .14s}
  .dl-btn:hover{transform:translateY(-1px);box-shadow:0 9px 22px rgba(4,150,165,.36)}
  .dl-btn:active{transform:translateY(0)}

  .cat-h{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
  .cat-h .nm{font-family:var(--f-display);font-size:20px;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:9px}
  .cat-h .ct{font-family:var(--f-label);font-size:11px;color:var(--muted);letter-spacing:.05em}
  .ck-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-family:var(--f-body);font-size:14px;color:var(--ink);transition:.12s}
  .ck:hover{border-color:var(--teal)}
  .ck .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:0 0 auto;display:grid;place-items:center;transition:.12s}
  .ck .bx svg{width:14px;height:14px;opacity:0}
  .ck .lb{flex:1}
  .ck.done .bx{background:var(--teal);border-color:var(--teal)}
  .ck.done .bx svg{opacity:1}
  .ck.done .lb{text-decoration:line-through;color:var(--muted)}

  /* phrases */
  .sec-h{font-family:var(--f-display);font-size:23px;color:var(--ink);letter-spacing:.01em;margin:34px 0 4px}
  .sec-lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .phr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
  .phr .e{font-size:19px;line-height:1}
  .phr .en{font-weight:600;color:var(--ink);font-size:13.5px;margin-top:6px}
  .phr .ms{color:var(--teal-d);font-size:13.5px;margin-top:1px;font-weight:500}
  .phr{position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s}
  .phr:hover{box-shadow:var(--sh-h)}
  .phr:active{transform:scale(.98)}
  .phr.speaking{box-shadow:0 0 0 2px var(--teal)}
  .phr .spk{position:absolute;top:8px;right:8px;width:30px;height:30px;border:none;border-radius:50%;background:rgba(4,150,165,.1);color:var(--teal-d);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .phr .spk:hover{background:rgba(4,150,165,.2)}
  .phr .en,.phr .ms{padding-right:30px}
  .spk-hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.3}

  footer{margin-top:42px;background:linear-gradient(135deg,var(--dark),var(--teal-d));border-radius:var(--r-l);padding:26px;color:#eafcfb;text-align:center}
  footer img{height:30px;margin:0 auto 12px;display:block}
  footer p{margin:0;font-family:var(--f-serif);font-style:italic;color:rgba(234,252,251,.78);font-size:14.5px}

  @media(max-width:560px){.hero h1{font-size:28px}}
  @media(max-width:430px){.ck-grid{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar"><img class="logo" src="images/kt-logo.png" alt="Kairali Trails"></div>

  <div class="hero">
    <div class="eb">&#127481;&#127469; Pack smart</div>
    <h1>Packing Checklist</h1>
    <p>Tick things off as you pack — your progress is saved on this device.</p>
  </div>

  <div class="prog">
    <div class="row">
      <span class="txt" id="progTxt">0 of 0 packed</span>
      <button class="reset" onclick="resetAll()">Reset</button>
    </div>
    <div class="bar"><div class="fill" id="progFill"></div></div>
    <button class="dl-btn" onclick="downloadJPG()">&#11015;&#65039; Download my list (JPG)</button>
  </div>

  <div id="lists"></div>

  <h2 class="sec-h">Handy Thai phrases</h2>
  <p class="sec-lead">A few words that go a long way with the locals.</p>
  <div class="ph-grid" id="phrases"></div>

  <footer>
    <img src="images/kt-white.png" alt="Kairali Trails">
    <p>Have a wonderful trip with Kairali Trails.</p>
  </footer>
</div>

<script>
const CHECKLIST_DATA = [
  { icon:"\uD83D\uDC55", title:"Clothing", items:["Light summer clothes","Swimwear","Beach flip-flops","Walking shoes","Hat / cap","Sunglasses","Light rain poncho"] },
  { icon:"\uD83E\uDDF4", title:"Toiletries", items:["Sunscreen SPF 50+ (reef-safe)","After-sun / aloe gel","Toothbrush & paste","Insect repellent","Personal toiletries"] },
  { icon:"\uD83D\uDC8A", title:"Health & Medicines", items:["Prescription medicines","Motion-sickness tablets","Basic first-aid","Paracetamol / stomach meds"] },
  { icon:"\uD83D\uDCF1", title:"Electronics", items:["Phone + charger","Universal adapter (A/B/C)","Power bank (cabin only)","Camera / GoPro"] },
  { icon:"\uD83D\uDCC4", title:"Documents & Money", items:["Passport (6+ months)","Air tickets / itinerary","Show money (~USD 200 in THB)","THB cash + forex / credit card","Travel insurance"] },
  { icon:"\uD83C\uDFDD\uFE0F", title:"Beach & Island Day", items:["Dry bag for phone","Quick-dry towel","Reusable water bottle","Snorkel gear (optional)"] },
  { icon:"\uD83C\uDF92", title:"Daily Essentials", items:["Day backpack","Umbrella","Tissues / wipes / sanitizer"] }
];

const PHRASES = [
  { e:"\uD83D\uDC4B", en:"Hello / Goodbye", ms:"Sawasdee kha / khrap", th:"สวัสดี" },
  { e:"\uD83D\uDE4F", en:"Thank you", ms:"Khop khun kha / khrap", th:"ขอบคุณ" },
  { e:"\uD83D\uDC4D", en:"Yes / No", ms:"Chai / Mai chai", th:"ใช่ ไม่ใช่" },
  { e:"\uD83D\uDE0A", en:"How are you?", ms:"Sabai dee mai?", th:"สบายดีไหม" },
  { e:"\uD83D\uDCB0", en:"How much?", ms:"Tao rai?", th:"เท่าไหร่" },
  { e:"\uD83D\uDCB8", en:"Too expensive", ms:"Phaeng pai", th:"แพงไป" },
  { e:"\uD83D\uDE0B", en:"Delicious", ms:"Aroy", th:"อร่อย" },
  { e:"\uD83C\uDF36\uFE0F", en:"Not spicy, please", ms:"Mai phet", th:"ไม่เผ็ด" },
  { e:"\uD83D\uDE14", en:"Excuse me / Sorry", ms:"Kho thot", th:"ขอโทษ" },
  { e:"\uD83D\uDEBB", en:"Where's the toilet?", ms:"Hong nam yu thi nai?", th:"ห้องน้ำอยู่ที่ไหน" },
  { e:"\uD83E\uDD14", en:"I don't understand", ms:"Mai khao jai", th:"ไม่เข้าใจ" },
  { e:"\uD83D\uDC4C", en:"No problem", ms:"Mai pen rai", th:"ไม่เป็นไร" },
  { e:"\uD83E\uDDFE", en:"Bill, please", ms:"Kep tang / Chek bin", th:"เก็บเงิน" },
  { e:"\u2728", en:"Beautiful", ms:"Suay", th:"สวย" },
  { e:"\uD83C\uDD98", en:"Help!", ms:"Chuay duay!", th:"ช่วยด้วย" }
];

const STORE_KEY = "kt-checklist-phuket";
let checked = {};
try { checked = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch(e) { checked = {}; }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(checked)); } catch(e){} }

const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>';

document.getElementById("lists").innerHTML = CHECKLIST_DATA.map((cat,ci)=>{
  const rows = cat.items.map((label,ii)=>{
    const id = "c"+ci+"-i"+ii;
    const on = checked[id] ? " done" : "";
    const safe = label.replace(/</g,"&lt;");
    return `<button class="ck${on}" id="${id}" onclick="toggle('${id}')"><span class="bx">${CHK}</span><span class="lb">${safe}</span></button>`;
  }).join("");
  return `<div class="cat-h"><div class="nm">${cat.icon} ${cat.title}</div><div class="ct" id="ct-${ci}"></div></div><div class="ck-grid">${rows}</div>`;
}).join("");

document.getElementById("phrases").innerHTML = PHRASES.map(function(p){
  var say=p.th||p.ms;
  return '<div class="phr" data-say="'+encodeURIComponent(say)+'" data-lang="th-TH" onclick="speak(this)" role="button" tabindex="0">'
   +'<button class="spk" type="button" aria-label="Play pronunciation" onclick="event.stopPropagation();speak(this.parentNode)">&#128266;</button>'
   +'<span class="e">'+p.e+'</span><div class="en">'+p.en+'</div><div class="ms">'+p.ms+'</div></div>';
}).join("");

var TTS_VOICES=[];
function ttsLoad(){ try{ TTS_VOICES=window.speechSynthesis?window.speechSynthesis.getVoices():[]; }catch(e){ TTS_VOICES=[]; } }
if(window.speechSynthesis){ ttsLoad(); try{ window.speechSynthesis.onvoiceschanged=ttsLoad; }catch(e){} }
function speak(card){
  if(!('speechSynthesis' in window)){ ttsHint(card,'Voice not supported on this device'); return; }
  var text=decodeURIComponent(card.getAttribute('data-say')||''); var lang=card.getAttribute('data-lang')||'en-US';
  if(!text) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.85;
    var base=lang.split('-')[0];
    var v=TTS_VOICES.find(function(x){return x.lang===lang;})||TTS_VOICES.find(function(x){return x.lang&&x.lang.toLowerCase().indexOf(base)===0;});
    if(v){ u.voice=v; } else { ttsHint(card,'Tip: add the '+(base==='th'?'Thai':'Malay')+' voice in your phone settings for the best pronunciation.'); }
    card.classList.add('speaking');
    u.onend=function(){ card.classList.remove('speaking'); };
    u.onerror=function(){ card.classList.remove('speaking'); };
    window.speechSynthesis.speak(u);
  }catch(e){ ttsHint(card,'Could not play on this device'); }
}
function ttsHint(card,msg){ var h=card.querySelector('.spk-hint'); if(!h){ h=document.createElement('div'); h.className='spk-hint'; card.appendChild(h); } h.textContent=msg; }

function toggle(id){
  checked[id] = !checked[id];
  save();
  const el = document.getElementById(id);
  if(el) el.classList.toggle("done", !!checked[id]);
  updateProgress();
}
function resetAll(){
  checked = {}; save();
  document.querySelectorAll(".ck.done").forEach(el=>el.classList.remove("done"));
  updateProgress();
}
function updateProgress(){
  let total=0, done=0;
  CHECKLIST_DATA.forEach((cat,ci)=>{
    let cdone=0;
    cat.items.forEach((label,ii)=>{ total++; if(checked["c"+ci+"-i"+ii]){done++; cdone++;} });
    const c=document.getElementById("ct-"+ci); if(c) c.textContent = cdone+"/"+cat.items.length;
  });
  document.getElementById("progTxt").textContent = done+" of "+total+" packed";
  document.getElementById("progFill").style.width = (total? Math.round(done/total*100):0)+"%";
}

function downloadJPG(){
  const W=860, pad=46, colGap=28;
  const colW=(W-pad*2-colGap)/2;
  const headerBand=140, catHeaderH=44, rowH=30, catGapAfter=18, footerH=66;
  const blocks=CHECKLIST_DATA.map((cat,ci)=>({cat,ci,h:catHeaderH+cat.items.length*rowH+catGapAfter}));
  const startY=headerBand+26;
  const colY=[startY,startY], colAssign=[];
  blocks.forEach(b=>{ const c=colY[0]<=colY[1]?0:1; colAssign.push({b,col:c,y:colY[c]}); colY[c]+=b.h; });
  const bodyBottom=Math.max(colY[0],colY[1]);
  const H=bodyBottom+footerH;
  const dpr=2;
  const cv=document.createElement('canvas'); cv.width=W*dpr; cv.height=H*dpr;
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  const hg=x.createLinearGradient(0,0,W,headerBand); hg.addColorStop(0,'#037885'); hg.addColorStop(1,'#0496a5');
  x.fillStyle=hg; x.fillRect(0,0,W,headerBand);
  const rgl=x.createRadialGradient(W*0.22,headerBand*0.2,10,W*0.22,headerBand*0.2,W*0.55);
  rgl.addColorStop(0,'rgba(36,251,170,.28)'); rgl.addColorStop(1,'rgba(36,251,170,0)');
  x.fillStyle=rgl; x.fillRect(0,0,W,headerBand);
  let total=0,done=0;
  CHECKLIST_DATA.forEach((cat,ci)=>cat.items.forEach((l,ii)=>{ total++; if(checked["c"+ci+"-i"+ii])done++; }));
  const dateStr=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  x.textBaseline='alphabetic'; x.textAlign='left';
  x.fillStyle='rgba(255,255,255,.78)'; x.font='600 13px Poppins, sans-serif';
  x.fillText('K A I R A L I   T R A I L S', pad, 46);
  x.fillStyle='#ffffff'; x.font='700 31px Poppins, sans-serif';
  x.fillText('Phuket \u00b7 Packing List', pad, 86);
  x.fillStyle='rgba(255,255,255,.9)'; x.font='500 15px Poppins, sans-serif';
  x.fillText(done+' of '+total+' packed     \u00b7     '+dateStr, pad, 116);
  function rr(px,py,pw,ph,r){ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+pw,py,px+pw,py+ph,r); x.arcTo(px+pw,py+ph,px,py+ph,r); x.arcTo(px,py+ph,px,py,r); x.arcTo(px,py,px+pw,py,r); x.closePath(); }
  colAssign.forEach(function(a){
    const b=a.b, cx=pad+a.col*(colW+colGap), y=a.y;
    x.textBaseline='alphabetic'; x.fillStyle='#037885'; x.font='700 18px Poppins, sans-serif';
    x.fillText(b.cat.title, cx, y+22);
    x.strokeStyle='#d7eef1'; x.lineWidth=1.5;
    x.beginPath(); x.moveTo(cx,y+34); x.lineTo(cx+colW,y+34); x.stroke();
    let iy=y+catHeaderH+4;
    b.cat.items.forEach(function(label,ii){
      const on=!!checked["c"+b.ci+"-i"+ii];
      const boxS=18, boxX=cx+1, boxY=iy-boxS/2;
      if(on){
        x.fillStyle='#0496a5'; rr(boxX,boxY,boxS,boxS,5); x.fill();
        x.strokeStyle='#ffffff'; x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round';
        x.beginPath(); x.moveTo(boxX+4.5,boxY+9.2); x.lineTo(boxX+7.6,boxY+12.6); x.lineTo(boxX+13.6,boxY+5.4); x.stroke();
      } else {
        x.strokeStyle='#bcdfe4'; x.lineWidth=1.6; rr(boxX,boxY,boxS,boxS,5); x.stroke();
      }
      const lx=cx+boxS+12, maxw=colW-(boxS+12);
      x.textBaseline='middle'; x.font='400 14.5px Poppins, sans-serif';
      x.fillStyle= on ? '#9fb6bb' : '#0e2e34';
      let txt=label;
      if(x.measureText(txt).width>maxw){ while(txt.length>4 && x.measureText(txt+'\u2026').width>maxw){ txt=txt.slice(0,-1); } txt=txt+'\u2026'; }
      x.fillText(txt, lx, iy);
      if(on){ const tw=x.measureText(txt).width; x.strokeStyle='#bcd3d7'; x.lineWidth=1.3; x.beginPath(); x.moveTo(lx,iy); x.lineTo(lx+tw,iy); x.stroke(); }
      iy+=rowH;
    });
  });
  x.textBaseline='alphabetic'; x.fillStyle='#5a9aa5'; x.font='500 13px Poppins, sans-serif'; x.textAlign='center';
  x.fillText('Generated with Kairali Trails  \u00b7  Have a wonderful trip!', W/2, bodyBottom+40);
  x.textAlign='left';
  try{
    const url=cv.toDataURL('image/jpeg',0.92);
    const a2=document.createElement('a'); a2.href=url; a2.download='phuket-packing-list.jpg';
    document.body.appendChild(a2); a2.click(); a2.remove();
  }catch(e){ alert('Could not generate the image on this device.'); }
}

updateProgress();
</script>
</body>
</html>
