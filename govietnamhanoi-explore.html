<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>kairalitrails · Explore Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/nyght-serif" rel="stylesheet">
<style>
  :root{
    --teal:#0496a5; --teal-d:#037885; --green:#24fbaa; --cyan:#29ffff;
    --blue:#1e98f7; --orange:#f3792a; --yellow:#fefdbb;
    --dark:#052a30; --dark-2:#0a3a42; --off:#f4fcfd; --muted:#5a9aa5;
    --ink:#0e2e34; --line:#d7eef1; --card:#ffffff;
    --r-s:8px; --r-m:16px; --r-l:24px;
    --sh:0 4px 24px rgba(4,150,165,.12); --sh-h:0 14px 40px rgba(4,150,165,.22);
    --f-display:'Tanker','Poppins',system-ui,sans-serif;
    --f-serif:'Nyght Serif',Georgia,serif;
    --f-body:'Poppins',system-ui,sans-serif;
    --f-label:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{margin:0;font-family:var(--f-body);color:var(--ink);background:var(--off);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{max-width:100%}
  .wrap{max-width:780px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) calc(70px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-right))}

  /* top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-body);font-weight:600;font-size:13.5px;color:var(--teal-d);text-decoration:none;border:1.5px solid var(--line);padding:8px 14px;border-radius:999px;transition:.15s}
  .back:hover{border-color:var(--teal);background:var(--card)}
  .back svg{width:15px;height:15px}
  .topbar img.logo{height:34px;display:block}

  /* hero */
  .hero{position:relative;border-radius:var(--r-l);overflow:hidden;margin-top:6px;box-shadow:var(--sh-h);background:linear-gradient(135deg,var(--dark),var(--teal-d) 60%,var(--teal));color:#eafcfb;padding:30px 26px}
  .hero::before{content:"";position:absolute;inset:0;opacity:.10;background-image:linear-gradient(135deg,transparent 46%,#fff 47% 48%,transparent 49%),linear-gradient(45deg,transparent 46%,#fff 47% 48%,transparent 49%);background-size:36px 36px}
  .hero .eb{position:relative;font-family:var(--f-label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
  .hero h1{position:relative;font-family:var(--f-display);font-size:38px;margin:0;letter-spacing:.01em;color:#fff}
  .hero p{position:relative;font-family:var(--f-serif);font-style:italic;color:rgba(234,252,251,.82);font-size:16px;margin:4px 0 0;max-width:80%}

  /* sticky tabs */
  .tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:12px 0;background:var(--off);margin-top:6px}
  .tab{flex:1;text-align:center;border:1.5px solid var(--line);background:var(--card);color:var(--teal-d);font-family:var(--f-body);font-weight:600;font-size:13.5px;padding:10px 8px;border-radius:999px;cursor:pointer;transition:.15s}
  .tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}

  /* sections */
  .sec{padding-top:14px;scroll-margin-top:64px}
  .sec h2{font-family:var(--f-display);font-size:23px;color:var(--ink);letter-spacing:.01em;margin:18px 0 4px}
  .sec .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .xcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh);transition:.15s}
  .xcard:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
  .xcard .ph{position:relative;aspect-ratio:1/1;background:linear-gradient(140deg,var(--teal-d),var(--teal));display:grid;place-items:center;overflow:hidden}
  .xcard .ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 22%,rgba(36,251,170,.38),transparent 60%);pointer-events:none}
  .ph-ph{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:9px;padding:14px;text-align:center}
  .ph-ic{font-size:44px;line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.28))}
  .ph-tt{font-family:var(--f-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.92);font-weight:500;max-width:90%}
  .xcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
  .xcard .bd{padding:14px}
  .xcard .ti{font-family:var(--f-display);font-size:17px;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
  .xcard .ti .ic{font-size:18px}
  .xcard .no{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.5}
  .xcard .tg{display:inline-block;font-family:var(--f-label);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-d);background:rgba(4,150,165,.1);padding:3px 8px;border-radius:6px;margin-top:9px}
  .xmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px}
  .xmeta .tg{margin-top:0}
  .xpill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-label);font-size:10px;letter-spacing:.03em;font-weight:500;color:var(--teal-d);background:rgba(4,150,165,.1);border:1px solid rgba(4,150,165,.22);padding:5px 10px;border-radius:999px;text-decoration:none}
  .xpill:active,.xpill:hover{background:rgba(4,150,165,.18)}
  .flight-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:9px;letter-spacing:.05em;font-weight:600;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--orange),#ff9d4d);padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(243,121,42,.32)}

  footer{margin-top:42px;background:linear-gradient(135deg,var(--dark),var(--teal-d));border-radius:var(--r-l);padding:26px;color:#eafcfb;text-align:center}
  footer img{height:30px;margin:0 auto 12px;display:block}
  footer p{margin:0 0 14px;font-family:var(--f-serif);font-style:italic;color:rgba(234,252,251,.78);font-size:14.5px}
  footer .home{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;padding:10px 18px;border-radius:999px}

  @media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.hero p{max-width:100%}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto}}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <img class="logo" src="images/kt-logo.png" alt="kairalitrails">
  </div>

  <div class="hero">
    <div class="eb">🇹🇭 Your free time</div>
    <h1>Explore Vietnam</h1>
    <p>Beaches, islands, food to try and souvenirs to take home.</p>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="sections"></div>

  <footer>
    <img src="images/kt-white.png" alt="kairalitrails">
    <p>Have a wonderful trip with kairalitrails.</p>
  </footer>
</div>

<script>
/* ============================================================
   EDIT HERE — add photos by putting the file in images/ and
   writing its name in `img`. Leave "" to show a placeholder.
   ============================================================ */
const IMG_BASE = "https://btulhnrguotqjkhyeazk.supabase.co/storage/v1/object/public/customer%20support/supportvietnam/";   // this country's Supabase folder
function imgURL(v){return v&&/^https?:\/\//.test(v)?v:(IMG_BASE+v);}

const EXPLORE = [
 { key:"see", label:"See & do", title:"Top things to see & do in Hanoi", lead:"Iconic sights around Hanoi & the north.", items:[
   { ic:"\uD83C\uDF04", ti:"Hoan Kiem Lake & Ngoc Son Temple", no:"The heart of Hanoi \u2014 a scenic lake with a red bridge to a temple island.", tg:"Old Quarter", img:"hoan-kiem.jpg", map:"Hoan Kiem Lake Hanoi" },
   { ic:"\uD83D\uDE82", ti:"Old Quarter & Train Street", no:"Buzzing lanes, street food and the railway that runs right between the cafes.", tg:"Hanoi", img:"train-street.jpg", map:"Hanoi Train Street" },
   { ic:"\u26F0\uFE0F", ti:"Ha Long Bay cruise", no:"Emerald water and limestone karsts \u2014 a day or overnight cruise.", tg:"Day trip", img:"halong-bay.jpg", map:"Ha Long Bay" },
   { ic:"\uD83C\uDFEF", ti:"Temple of Literature", no:"Vietnam's first university \u2014 peaceful courtyards and classic architecture.", tg:"Hanoi", img:"temple-literature.jpg", map:"Temple of Literature Hanoi" },
   { ic:"\uD83C\uDFAD", ti:"Water puppet show", no:"A charming traditional art form performed on water, with live music.", tg:"Evening", img:"water-puppet.jpg", map:"Thang Long Water Puppet Theatre Hanoi" }
 ]},
 { key:"eat", label:"Eat", title:"Must-try food & drink", lead:"Don't leave without trying these.", items:[
   { ic:"\uD83C\uDF5C", ti:"Pho", no:"Vietnam's iconic noodle soup \u2014 have it for breakfast like the locals.", tg:"Must try", img:"pho.jpg" },
   { ic:"\uD83E\uDD6A", ti:"Banh mi", no:"Crispy baguette stuffed with meats, pate and pickled veg.", tg:"Street food", img:"banh-mi.jpg" },
   { ic:"\u2615", ti:"Egg coffee", no:"Hanoi's famous creamy egg-yolk coffee \u2014 try it at Giang Cafe.", tg:"Hanoi classic", img:"egg-coffee.jpg", map:"Giang Cafe Hanoi" },
   { ic:"\uD83C\uDF72", ti:"Bun cha", no:"Grilled pork with noodles and herbs \u2014 a true Hanoi speciality.", tg:"Lunch", img:"bun-cha.jpg", map:"Bun Cha Huong Lien Hanoi" },
   { ic:"\uD83C\uDF65", ti:"Fresh spring rolls", no:"Light rice-paper rolls with herbs, shrimp and a tangy dip.", tg:"Light bite", img:"spring-rolls.jpg" },
   { ic:"\uD83C\uDF66", ti:"Mixue", no:"Cheap, hugely popular ice-cream & tea chain \u2014 great in the heat.", tg:"Near you", img:"mixue.jpg", map:"Mixue" }
 ]},
 { key:"buy", label:"Take home", title:"Souvenirs to take home", lead:"Little bits of Vietnam for family & friends.", items:[
   { ic:"\u2615", ti:"Vietnamese coffee", no:"Robusta beans and a phin filter \u2014 a classic, easy gift.", tg:"Gift", img:"coffee-beans.jpg" },
   { ic:"\uD83E\uDDF5", ti:"Silk & handicrafts", no:"Hanoi is known for silk scarves, lacquerware and embroidery.", tg:"Souvenir", img:"silk.jpg" },
   { ic:"\uD83D\uDC52", ti:"Conical hat (non la)", no:"The iconic Vietnamese hat \u2014 light and very photogenic.", tg:"Keepsake", img:"conical-hat.jpg" },
   { ic:"\uD83E\uDDF2", ti:"Fridge magnet", no:"Grab a Hanoi or Ha Long magnet as a little memory.", tg:"Keepsake", img:"magnet.jpg" }
 ]}
];

/* ===== render ===== */
document.getElementById("tabs").innerHTML = EXPLORE.map((s,i)=>
  `<button class="tab${i===0?' active':''}" data-k="${s.key}" onclick="goTab('${s.key}')">${s.label}</button>`).join("");

document.getElementById("sections").innerHTML = EXPLORE.map(s=>{
  const cards = s.items.map(m=>{
    const mapUrl = m.map ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m.map)}` : "";
    const chips = [
      m.flight?`<span class="flight-badge">&#9992;&#65039; Pre-order on your flight</span>`:"",
      m.tg?`<span class="tg">${m.tg}</span>`:"",
      mapUrl?`<a class="xpill" href="${mapUrl}" target="_blank" rel="noopener">&#128205; Open in Maps</a>`:""
    ].join("");
    return `<div class="xcard">
      <div class="ph"><div class="ph-ph"><span class="ph-ic">${m.ic}</span><span class="ph-tt">${m.ti}</span></div>${m.img?`<img src="${imgURL(m.img)}" alt="${m.ti}" onerror="this.remove()">`:""}</div>
      <div class="bd">
        <div class="ti"><span class="ic">${m.ic}</span>${m.ti}</div>
        <div class="no">${m.no}</div>
        ${chips?`<div class="xmeta">${chips}</div>`:""}
      </div></div>`;
  }).join("");
  return `<section class="sec" id="sec-${s.key}"><h2>${s.title}</h2><p class="lead">${s.lead}</p><div class="grid">${cards}</div></section>`;
}).join("");

function goTab(k){
  document.getElementById("sec-"+k).scrollIntoView({behavior:"smooth",block:"start"});
}
/* highlight active tab on scroll */
const obs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    const k=e.target.id.replace("sec-","");
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.k===k));
  }});
},{rootMargin:"-50% 0px -45% 0px"});
EXPLORE.forEach(s=>obs.observe(document.getElementById("sec-"+s.key)));
</script>
<script>document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});document.addEventListener("gesturechange",function(e){e.preventDefault();},{passive:false});document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});</script>
</body>
</html>
