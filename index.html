<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>kairalitrails</title>
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0496a5;--green:#24fbaa;--dark:#052a30;--off:#f4fcfd;--muted:#5a9aa5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--off);
    font-family:'Poppins',system-ui,sans-serif;color:var(--dark);text-align:center;padding:24px}
  .logo{font-family:'Tanker','Poppins',sans-serif;font-size:30px;
    background:linear-gradient(90deg,var(--teal),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
  p{color:var(--muted);font-size:14.5px;max-width:340px;line-height:1.6;margin:14px auto 0}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
</style>
</head>
<body>
  <div>
    <div class="logo">kairalitrails</div>
    <p>Please open the personal trip link shared with you on WhatsApp to view your travel details.</p>
  </div>
<script>document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});document.addEventListener("gesturechange",function(e){e.preventDefault();},{passive:false});document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});</script>
</body>
</html>
