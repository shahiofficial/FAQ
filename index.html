<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>kairalitrails</title>
<link href="https://api.fontshare.com/v2/css?f[]=tanker@400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0496a5;--green:#24fbaa;--dark:#052a30;--off:#f4fcfd;--muted:#5a9aa5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--off);
    font-family:'Poppins',system-ui,sans-serif;color:var(--dark);text-align:center;padding:24px}
  .logo{font-family:'Tanker','Poppins',sans-serif;font-size:30px;
    background:linear-gradient(90deg,var(--teal),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.01em}
  p{color:var(--muted);font-size:14.5px;max-width:340px;line-height:1.6;margin:14px auto 0}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation}
</style>
</head>
<body>
  <div>
    <div class="logo">kairalitrails</div>
    <p>Please open the personal trip link shared with you on WhatsApp to view your travel details.</p>
  </div>
<script>document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});document.addEventListener("gesturechange",function(e){e.preventDefault();},{passive:false});document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});</script>
<!-- ===== language switch (Style E) ===== -->
<div id="google_translate_element" style="display:none"></div>
<div class="ktlang">
  <button class="ktlang-chip" onclick="event.stopPropagation();document.querySelector('.ktlang-dd').classList.toggle('open')"><span id="ktlangName">English</span> <span class="ktlang-car">&#9662;</span></button>
  <div class="ktlang-dd">
    <button data-lang="en" class="on">English</button>
    <button data-lang="ml" class="mlx">&#3374;&#3378;&#3375;&#3390;&#3379;&#3330;</button>
    <button data-lang="kn" class="knx">&#3221;&#3240;&#3277;&#3240;&#3233;</button>
    <button data-lang="ta" class="tax">&#2980;&#2990;&#3007;&#2996;&#3021;</button>
  </div>
</div>
<style>
.ktlang{position:fixed;top:10px;right:12px;z-index:99999;font-family:'Poppins',sans-serif}
.ktlang-chip{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);border:none;border-bottom:2px solid #0496a5;border-radius:5px 5px 0 0;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:#037885;box-shadow:0 4px 12px rgba(4,60,70,.16)}
.ktlang-car{font-size:9px;opacity:.7}
.ktlang-dd{position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid #d7eef1;border-radius:12px;box-shadow:0 14px 30px -8px rgba(4,60,70,.28);padding:5px;display:none;min-width:150px}
.ktlang-dd.open{display:block}
.ktlang-dd button{display:block;width:100%;padding:10px 13px;border:none;background:transparent;border-radius:9px;cursor:pointer;font-size:14.5px;color:#0e2e34;text-align:left;font-family:'Poppins','Noto Sans Malayalam','Noto Sans Kannada','Noto Sans Tamil',sans-serif}
.ktlang-dd button.on{background:rgba(4,150,165,.1);color:#037885;font-weight:600}
.goog-te-banner-frame,.goog-te-gadget,.skiptranslate iframe{display:none!important}
body{top:0!important}
.goog-text-highlight{background:none!important;box-shadow:none!important}
#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
</style>
<script>
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'ml,kn,ta',autoDisplay:false},'google_translate_element');}
(function(){var NAME={en:'English',ml:'\u0D2E\u0D32\u0D2F\u0D3E\u0D33\u0D02',kn:'\u0C95\u0CA8\u0CCD\u0CA8\u0CA1',ta:'\u0BA4\u0BAE\u0BBF\u0BB4\u0BCD'};
 function apply(lang){var set=function(){var sel=document.querySelector('.goog-te-combo');if(sel){sel.value=(lang==='en'?'':lang);sel.dispatchEvent(new Event('change'));return true;}return false;};
   if(!set()){var n=0,iv=setInterval(function(){if(set()||++n>24)clearInterval(iv);},250);}
   var nm=document.getElementById('ktlangName');if(nm)nm.textContent=NAME[lang];
   document.querySelectorAll('.ktlang-dd button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lang')===lang);});
   var d=document.querySelector('.ktlang-dd');if(d)d.classList.remove('open');}
 document.querySelectorAll('.ktlang-dd button').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();apply(b.getAttribute('data-lang'));});});
 document.addEventListener('click',function(){var d=document.querySelector('.ktlang-dd');if(d)d.classList.remove('open');});})();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
